# Build, static checks and the Playwright e2e suite on every push to main and every PR.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment): a tag can be
# moved to different code, a SHA can't. Update them deliberately, like dependencies.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must satisfy package.json engines (^22.22.3 || ^24.15.0 || >=26); engineStrict fails installs otherwise.
  NODE_VERSION: 22.23.2

jobs:
  static:
    name: Build, typecheck, lint, standards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first and separately: typecheck doesn't wait for the web build, which
      # regenerates apps/web/src/routeTree.gen.ts.
      - name: Build
        run: pnpm turbo run build

      - name: Typecheck and lint
        run: pnpm turbo run typecheck lint

      - name: Code standards
        run: node .claude/skills/aure-code-standards/scripts/check-standards.mjs --all

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # scripts/stack.mjs starts a throwaway cluster with initdb/postgres/pg_ctl.
      # The runner image ships PostgreSQL with the service disabled and its
      # binaries off PATH; put the newest version's bin dir on PATH.
      - name: Put PostgreSQL binaries on PATH
        run: |
          pg_bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/postgres" --version

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @aure/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @aure/e2e exec playwright install --with-deps chromium

      # System libraries aren't in the browser cache, so install them on a cache hit too.
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @aure/e2e exec playwright install-deps chromium

      # Turbo builds api + web, then global setup starts the stack (fresh database),
      # runs both projects and stops the stack. CI=true enables retries with
      # failOnFlakyTests and the HTML report.
      - name: Run e2e suite
        run: pnpm test:e2e

      - name: Upload Playwright report and stack logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            .stack/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      # Global setup stops the stack, but not if the run was cancelled or crashed mid-way.
      - name: Stop the stack
        if: always()
        run: node scripts/stack.mjs down || true
